; PlatformIO 工程配置 —— ESP32-C3 ProMini/SuperMini 远程电源开关
; 用 VSCode + PlatformIO 插件打开本目录即可编译上传

[env:esp32-c3]
; 锁定 espressif32@6.12.0（本机已安装，arduino-esp32 3.0.x）：
; 新版 espressif32 7.x 的 arduino-esp32 内核与 Blinker 0.3.10 存在 F() 宏
; 返回值类型不兼容，故锁定该版本；Blinker 使用官方 GitHub 仓库（0.3.12，
; 已修复 ESP32 下该兼容问题）
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

; 串口监视器波特率
monitor_speed = 115200

; 上传速度（ProMini 无自动复位电路，上传前需按住 BOOT 键）
upload_speed = 921600
; 若自动识别不到串口，取消注释并改成实际串口号
; upload_port = COM3

; 依赖库：点灯 Blinker（官方 GitHub master 分支 0.3.12，zip 直连下载，
; 已修复与 arduino-esp32 3.x 内核 F() 宏的兼容问题）
lib_deps =
    https://github.com/blinker-iot/blinker-library/archive/refs/heads/master.zip
